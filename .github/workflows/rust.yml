name: Rust

on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  cxx-bindings:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # The C++ suite links against the artifacts the build script publishes, so the
      # Rust side has to be built first.
      - name: Build the Rust artifacts
        run: cargo build -p mefikit-ffi --release
      - name: Configure
        run: cmake -S crates/mefikit-ffi/examples -B build/cpp -DCMAKE_BUILD_TYPE=Release
      - name: Build the C++ suite
        run: cmake --build build/cpp
      - name: Run tests
        run: ctest --test-dir build/cpp --output-on-failure

