version: 2

updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Python dependencies
  - package-ecosystem: uv
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
