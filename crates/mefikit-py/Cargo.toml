[package]
name = "mefipy"
version = "0.4.1"
edition = "2024"

[lib]
name = "mefipy"
crate-type = ["cdylib"]
bench = false

[dependencies]
ndarray = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = [
  "experimental-inspect",
  "extension-module",
] }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
cubecl = { workspace = true, optional = true }

mefikit = { path = "../mefikit", features = ["io", "rayon"] }

[features]
# The wgpu runtime ships by default; the pure-CPU runtime is opt-in because it
# pulls an LLVM toolchain (cubecl-llvm). Without any runtime, `FieldRef.stats`
# transparently falls back to a host reduction.
default = ["gpu"]
gpu = ["mefikit/gpu", "dep:cubecl"]
gpu-cpu = ["mefikit/gpu-cpu"]
